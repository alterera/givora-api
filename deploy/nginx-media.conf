server {
  listen 443 ssl http2;
  server_name media.givora.in;

  ssl_certificate /etc/letsencrypt/live/media.givora.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/media.givora.in/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:9000/givora-media/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
