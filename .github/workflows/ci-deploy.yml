name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: givora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/givora
      JWT_ACCESS_SECRET: ci-secret-must-be-at-least-32-characters
      OTP_PEPPER: ci-otp-pepper-value
      WEB_ORIGIN: http://localhost:3000
      PUBLIC_WEB_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Update server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="/root/.nvm/versions/node/v24.21.0/bin:$PATH"
            cd /var/www/givora-api
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 startOrReload ecosystem.config.cjs --update-env
            sleep 2
            curl --fail --silent http://127.0.0.1:4000/api/v1/health | grep -q '"database":"ok"'
